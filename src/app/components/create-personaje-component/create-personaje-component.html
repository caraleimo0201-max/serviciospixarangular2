<h1>Crear personaje</h1>

<form #formPersonaje="ngForm"
      (ngSubmit)="insertarPersonaje()">

    <label>ID personaje:</label>
    <input type="number" #cajaid
           class="form-control" required>

    <label>Nombre:</label>
    <input type="text" #cajanombre
           class="form-control" required>

    <label>Imagen:</label>
    <input type="text" #cajaimagen
           class="form-control" required>

    <button type="submit"
            class="btn btn-success mt-3">
        Crear personaje
    </button>

</form>
