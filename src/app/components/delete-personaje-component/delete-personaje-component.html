<h1>Eliminar personaje Pixar</h1>

<form #formEliminar="ngForm"
      (ngSubmit)="eliminarPersonaje()">

    <label>Introduce el ID del personaje:</label>

    <input type="number"
           #cajaid
           class="form-control"
           required
           name="id">

    <button type="submit"
            class="btn btn-danger mt-3">
        Eliminar personaje
    </button>

</form>
